name: Publish GitHub release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select tagged release source
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Validate version and extract release notes
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match package version')
          module = ast.parse(Path('src/napari_sam3_assistant/__init__.py').read_text())
          runtime_version = next(
              ast.literal_eval(node.value) for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__'
                      for target in node.targets)
          )
          if runtime_version != version:
              raise SystemExit('Runtime and package versions differ')
          entries = Path('CHANGELOG.md').read_text().split('\n## ')
          entry = next((entry for entry in entries[1:]
                        if entry.splitlines()[0].split()[0] == version), None)
          if entry is None:
              raise SystemExit('Missing changelog entry for release')
          Path('release-notes.md').write_text(entry.split('\n', 1)[1].strip() + '\n')
          PY
      - name: Build and check packages
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish release and packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --latest --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
